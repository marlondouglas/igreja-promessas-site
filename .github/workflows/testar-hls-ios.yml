name: Testar pacote HLS iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Testes do pacote
        run: node --test operacao/transmissao-ios/hls-manifest.test.js
