name: Publicar Igreja Promessas no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter site
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
